name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Enforce 100% Python unit line coverage
        run: |
          python -m coverage run -m pytest -m "not integration" -q
          python -m coverage report
          python -m coverage json
          python -m coverage xml
          python -m coverage html

      - name: Enforce 100% browser unit line coverage
        run: npm run test:coverage

      - name: Run loopback integration tests separately
        run: python -m pytest -m integration -q

      - name: Upload measured coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error

      - name: Build Docker image
        run: docker build --tag pod:test .
