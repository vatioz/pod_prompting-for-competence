podcast:
  title: Prompting for Competence
  description: Personal learning podcast feed generated from queued topics.
  author: Your Name
  base_url: http://127.0.0.1:6001
  language: en-us
  artwork:
    source_path: ""
    public_url: ""
    alt_text: ""
worker:
  poll_seconds: 3
research:
  provider: azure_foundry
  endpoint: ''
  model: ''
  api_key_env: AZURE_OPENAI_API_KEY
  timeout_seconds: 90
  include_search_sources: true
  allowed_domains: []
  blocked_domains: []
  reasoning_effort: ''
  minimum_characters: 500
script:
  provider: azure_foundry
  endpoint: ''
  model: ''
  api_key_env: AZURE_OPENAI_API_KEY
  timeout_seconds: 90
  reasoning_effort: ''
  overview_target_minutes: 5
  deep_dive_target_minutes: 18
tts:
  provider: azure_speech
  mode: sync
  timeout_seconds: 90
  ffmpeg_path: ffmpeg
  speech_endpoint: ''
  speech_region: ''
  speech_api_key_env: AZURE_SPEECH_KEY
  speech_voice: ''
  speech_output_format: audio-24khz-96kbitrate-mono-mp3
  speech_sync_max_minutes: 9.5
  azure_openai_endpoint: ''
  azure_openai_api_key_env: AZURE_OPENAI_API_KEY
  azure_openai_model: tts-1-hd
  azure_openai_voice: alloy
  azure_openai_response_format: mp3
  azure_openai_speed: 1.0
  azure_openai_max_chars_per_request: 3500
  # ElevenLabs settings, used only when provider is elevenlabs
  voice_id: ""
  model_id: eleven_multilingual_v2
  output_format: mp3_44100_128
  base_url: https://api.elevenlabs.io
  stability: 0.45
  similarity_boost: 0.75
  style: 0.2
  use_speaker_boost: true
publishing:
  # Default is app-hosted preview: the app serves /feed.xml and /audio/<file>
  # itself and never touches remote infrastructure.
  #
  # To publish to an Azure Storage static website instead, set:
  #   target: azure_static
  #   deploy_enabled: true
  #   public_base_url: https://<account>.z6.web.core.windows.net/<prefix>
  #   azure_account_url: https://<account>.blob.core.windows.net
  #   azure_path_prefix: <prefix>
  # and provide AZURE_STORAGE_CONNECTION_STRING.
  #
  # Note: deploying deletes remote files under azure_path_prefix that are not
  # part of the current bundle. Always set a prefix; never point this at a
  # container holding unrelated content.
  target: app_hosted
  public_base_url: ""
  export_dir: /data/publish
  auto_publish: false
  deploy_enabled: false
  azure_container: $web
  azure_path_prefix: podcast
  azure_delete_stale: true
  azure_allow_root_delete: false
  azure_credential_mode: connection_string
  azure_connection_string_env: AZURE_STORAGE_CONNECTION_STRING
  azure_account_url: ""
ui:
  recent_topics_limit: 12
